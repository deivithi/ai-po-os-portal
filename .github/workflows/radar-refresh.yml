name: Refresh Radar Vivo

on:
  workflow_dispatch:
  schedule:
    - cron: "15 11 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: radar-vivo-refresh
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Refresh radar health
        run: python scripts/refresh_radar.py

      - name: Commit radar health if changed
        run: |
          if git diff --quiet -- data/radar_health.json; then
            echo "Nenhuma mudanca no radar health."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/radar_health.json
          git commit -m "chore: refresh radar health"
          git push

      - name: Package GitHub Pages artifact
        run: |
          tar \
            --dereference --hard-dereference \
            --directory "." \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            --exclude=".[^/]*" \
            .

      - name: Upload artifact
        id: artifact
        uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

      - name: Deploy to GitHub Pages via API
        id: deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/deploy_pages.py \
            --artifact-id "${{ steps.artifact.outputs.artifact-id }}"
